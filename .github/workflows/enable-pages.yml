# GitHub Pages를 gh-pages 브랜치로 켜 보는 작업 (Actions 탭에서 직접 실행).
# 저장소 설정 권한이 부족하면 실패하며, 그때는 Settings → Pages에서 직접 켜야 해요.
name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on Pages from gh-pages (root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '"status=\(.status) url=\(.html_url) source=\(.source.branch)\(.source.path)"'
