# 달빛 한국사 여행(history/)을 gh-pages 브랜치로 올려 GitHub Pages로 공개해요.
# 공개 저장소는 gh-pages 브랜치가 생기면 보통 Pages가 자동으로 켜져요.
# 켜지지 않으면: Settings → Pages → Source를 "Deploy from a branch", 브랜치를 gh-pages / (root)로 골라 주세요.
name: Publish history to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["history/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push history/ to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir site
          cp -r history/. site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish history/ from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
